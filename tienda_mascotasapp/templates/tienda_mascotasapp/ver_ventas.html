{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas - Huellitas & Cía.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos de Mascotas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS TEMÁTICOS TIENDA DE MASCOTAS --- */
        body {
            /* Imagen de fondo desde static */
            background-image: url('{% static "img/fondo_mascotas.jpg" %}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #fdf8f5; 
        }
        .navbar-pet { background-color: #ff7b54; } 
        .card-pet { 
            border-radius: 1.5rem; 
            border: none; 
            border-top: 8px solid #198754; /* Borde verde para Ventas */
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            background-color: rgba(255, 255, 255, 0.95);
        }
        .btn-pet { 
            background-color: #ff7b54; 
            color: white; 
            border: none; 
            border-radius: 0.5rem; 
            transition: 0.3s; 
        }
        .btn-pet:hover { 
            background-color: #f06a43; 
            color: white; 
            transform: translateY(-2px); 
        }
        .text-pet { color: #ff7b54; }
    </style>
</head>
<body>

    <!-- Navegación Admin Temática -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pet mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/inicio/">
                <i class="fa-solid fa-paw me-2"></i>Huellitas & Cía. - Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="/ver_productos/"><i class="fa-solid fa-box me-1"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_clientes/"><i class="fa-solid fa-users me-1"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_stock/"><i class="fa-solid fa-cubes me-1"></i> Stock</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/ver_ventas/"><i class="fa-solid fa-receipt me-1"></i> Ventas</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-light btn-sm px-3 fw-bold text-pet rounded-pill" onclick="cerrarSesion()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container pb-5">
        
        <!-- Cabecera -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 bg-white bg-opacity-90 p-4 rounded-4 shadow-sm">
            <h2 class="fw-bold text-dark mb-3 mb-md-0">
                <i class="fa-solid fa-file-invoice-dollar text-success me-3"></i>Registro General de Ventas
            </h2>
            <a href="/inicio/" class="btn btn-outline-secondary fw-bold rounded-pill px-4">
                <i class="fa-solid fa-house me-2"></i>Volver al Inicio
            </a>
        </div>
        
        <div class="card card-pet overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 text-muted">ID Venta</th>
                                <th class="py-3 text-muted"><i class="fa-regular fa-calendar me-1"></i> Fecha</th>
                                <th class="text-start py-3 text-muted"><i class="fa-solid fa-user me-1"></i> Cliente</th>
                                <th class="py-3 text-muted">RUT</th>
                                <th class="py-3 text-muted"><i class="fa-solid fa-wallet me-1"></i> Método de Pago</th>
                                <th class="py-3 text-muted">Total</th>
                                <th class="py-3 pe-4 text-muted">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-ventas-body">
                            <tr>
                                <td colspan="7" class="py-5">
                                    <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;"></div>
                                    <p class="mt-3 mb-0 text-muted">Cargando registro de ventas...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de conexión con la API -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarVentasAdmin();
        });

        async function cargarVentasAdmin() {
            const token = localStorage.getItem('token');
            const rol = localStorage.getItem('rol');

            // Seguridad: Expulsar si no es admin
            if (!token || rol !== 'admin') {
                alert("Acceso denegado. Área exclusiva para administradores.");
                window.location.href = '/login/';
                return;
            }

            const tbody = document.getElementById('tabla-ventas-body');

            try {
                const response = await fetch('/api/venta/', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error("No se pudo cargar la lista de ventas.");
                }

                const ventas = await response.json();
                tbody.innerHTML = '';

                if (ventas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="py-5 text-muted"><i class="fa-solid fa-cash-register fs-1 mb-3 opacity-25"></i><br>Aún no hay ventas registradas en el sistema.</td></tr>';
                    return;
                }

                // Generar las filas dinámicamente
                ventas.forEach(venta => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-bold text-muted bg-light border-end">#${venta.id}</td>
                        <td class="text-secondary">${venta.fecha}</td>
                        <td class="text-start fw-bold text-dark py-3 ps-3">${venta.cliente}</td>
                        <td><span class="badge bg-light text-dark border px-2 py-1">${venta.cliente_rut}</span></td>
                        <td><span class="badge bg-success rounded-pill px-3 py-2 shadow-sm"><i class="fa-solid fa-circle-check me-1"></i>${venta.metodo_pago}</span></td>
                        <td class="text-success fw-bold fs-5">$${Number(venta.total).toLocaleString('es-CL')}</td>
                        <td class="pe-4">
                            <a href="/ver_detalle_venta/${venta.id}/" class="btn btn-sm btn-pet fw-bold shadow-sm px-3">
                                <i class="fa-solid fa-eye me-1"></i> Ver Detalle
                            </a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error al cargar ventas:", error);
                tbody.innerHTML = '<tr><td colspan="7" class="text-danger py-5"><i class="fa-solid fa-triangle-exclamation me-2"></i>Error de conexión al cargar el registro de ventas.</td></tr>';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            window.location.href = '/login/';
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
