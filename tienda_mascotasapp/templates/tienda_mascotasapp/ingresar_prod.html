<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar Producto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .contenedor {
            width: 50%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .boton {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .acciones {
            text-align: center;
        }
        /* ESTILO PARA EL MENSAJE DE ERROR */
        .error-msg {
            background-color: #ffdddd;
            color: #d8000c;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid #d8000c;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h1>➕ Ingresar Producto</h1>

    <!-- BLOQUE DE ERROR -->
    {% if error %}
        <div class="error-msg">
            <strong>❌ {{ error }}</strong>
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="Nombre_Producto">Nombre del Producto:</label>
        <input type="text" id="Nombre_Producto" name="Nombre_Producto" required>

        <label for="Marca">Marca:</label>
        <input type="text" id="Marca" name="Marca" required>

        <label for="Categoria">Categoría:</label>
        <input type="text" id="Categoria" name="Categoria" required>

        <label for="Precio_Costo">Precio de Costo:</label>
        <input type="number" id="Precio_Costo" name="Precio_Costo" step="0.01" required>

        <label for="Precio_Venta">Precio de Venta:</label>
        <input type="number" id="Precio_Venta" name="Precio_Venta" step="0.01" required>

        <label for="Fecha_Venc">Fecha de Vencimiento (Opcional):</label>
        <input type="date" id="Fecha_Venc" name="Fecha_Venc">

        <label for="Stock_Inicial">Stock Inicial en Bodega:</label>
        <input type="number" id="Stock_Inicial" name="Stock_Inicial" min="0" required>

        <div class="acciones">
            <button type="submit" class="boton">💾 Guardar Producto</button>
            <a href="{% url 'inicio' %}" class="boton" style="background-color: #777;">🏠 Volver</a>
        </div>
    </form>

</div>

</body>
</html>
