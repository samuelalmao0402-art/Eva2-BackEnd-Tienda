{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - Huellitas & Cía.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos de Mascotas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS TEMÁTICOS TIENDA DE MASCOTAS --- */
        body {
            /* Imagen de fondo desde static */
            background-image: url('{% static "img/fondo_mascotas.jpg" %}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #fdf8f5; 
        }
        .navbar-pet { background-color: #ff7b54; } 
        .card-pet { 
            border-radius: 1.5rem; 
            border: none; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            /* Fondo blanco ligeramente transparente para mejorar la lectura */
            background-color: rgba(255, 255, 255, 0.95);
        }
        .bg-pet { background-color: #ff7b54; }
        .text-pet { color: #ff7b54; }
        .btn-pet { 
            background-color: #ff7b54; 
            color: white; 
            border: none; 
            border-radius: 0.5rem; 
            transition: 0.3s; 
        }
        .btn-pet:hover { 
            background-color: #f06a43; 
            color: white; 
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <!-- Navegación Cliente Temática -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pet mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">
                <i class="fa-solid fa-paw me-2"></i>Huellitas & Cía.
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center fw-semibold">
                    <li class="nav-item"><a class="nav-link active" href="/catalogo/"><i class="fa-solid fa-store me-1"></i> Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="/carrito/"><i class="fa-solid fa-cart-shopping me-1"></i> Mi Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" href="/compras/"><i class="fa-solid fa-bag-shopping me-1"></i> Mis Compras</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-light btn-sm px-3 fw-bold text-pet rounded-pill" onclick="cerrarSesion()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pb-5">
        <div class="row justify-content-center" id="detalle-container">
            <!-- Loader inicial -->
            <div class="col-12 text-center py-5 bg-white bg-opacity-75 rounded-4 shadow-sm" style="max-width: 400px; margin: 0 auto;">
                <div class="spinner-border text-pet" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Cargando producto...</span>
                </div>
                <h5 class="text-muted mt-3">Preparando el producto...</h5>
            </div>
        </div>
    </div>

    <!-- Lógica de conexión con la API -->
    <script>
        const productoId = "{{ producto_id }}"; 

        document.addEventListener("DOMContentLoaded", () => {
            cargarDetalleProducto();
        });

        async function cargarDetalleProducto() {
            const contenedor = document.getElementById('detalle-container');

            try {
                const response = await fetch(`/api/producto/${productoId}/`);
                
                if (!response.ok) throw new Error("Producto no encontrado.");

                const prod = await response.json();

                // Lógica visual para el stock
                const btnDisabled = prod.stock_disponible <= 0 ? 'disabled' : '';
                const stockIcon = prod.stock_disponible > 0 ? 'fa-check-circle' : 'fa-circle-xmark';
                const stockColor = prod.stock_disponible > 0 ? 'text-success' : 'text-danger';
                
                const stockText = prod.stock_disponible > 0 
                    ? `<span class="${stockColor} fw-bold"><i class="fa-solid ${stockIcon} me-1"></i>${prod.stock_disponible} disponibles</span>` 
                    : `<span class="${stockColor} fw-bold"><i class="fa-solid ${stockIcon} me-1"></i>Agotado temporalmente</span>`;

                // Renderizamos la tarjeta de detalle
                contenedor.innerHTML = `
                    <div class="col-lg-10">
                        <div class="card card-pet overflow-hidden">
                            <div class="row g-0">
                                <!-- Área de Imagen (Icono Placeholder) -->
                                <div class="col-md-5 bg-light bg-opacity-75 d-flex align-items-center justify-content-center p-5 border-end">
                                    <i class="fa-solid fa-box-open text-pet opacity-25" style="font-size: 8rem;"></i>
                                </div>
                                
                                <!-- Área de Información -->
                                <div class="col-md-7">
                                    <div class="card-body p-5">
                                        <span class="badge bg-pet text-white mb-3 fs-6 px-3 py-2 rounded-pill shadow-sm">
                                            <i class="fa-solid fa-tag me-1"></i> ${prod.categoria}
                                        </span>
                                        <h2 class="card-title text-dark fw-bold mb-1">${prod.nombre_producto}</h2>
                                        <h5 class="text-muted mb-4"><i class="fa-solid fa-copyright me-1"></i> Marca: ${prod.marca}</h5>
                                        
                                        <h1 class="display-4 text-pet fw-bold mb-4">$${Number(prod.precio_venta).toLocaleString('es-CL')}</h1>
                                        
                                        <div class="mb-4 p-4 bg-light bg-opacity-75 rounded-4 border border-light shadow-sm">
                                            <p class="fs-5 mb-2 text-dark">Inventario: ${stockText}</p>
                                            ${prod.fecha_venc ? `<p class="text-muted mb-0"><i class="fa-regular fa-calendar-xmark me-1"></i> Vence el: <strong>${prod.fecha_venc}</strong></p>` : ''}
                                        </div>

                                        <div class="d-grid gap-3 d-md-flex">
                                            <button class="btn btn-pet btn-lg fw-bold px-4 py-3 shadow-sm flex-grow-1" onclick="agregarAlCarrito(${prod.id}, ${prod.stock_disponible})" ${btnDisabled}>
                                                <i class="fa-solid fa-cart-plus me-2"></i> Agregar al Carrito
                                            </button>
                                            <a href="/catalogo/" class="btn btn-outline-secondary btn-lg fw-bold px-4 py-3 bg-white">
                                                <i class="fa-solid fa-arrow-left me-1"></i> Volver
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = `
                    <div class="col-md-6 text-center py-5 bg-white bg-opacity-75 rounded-4 shadow-sm">
                        <i class="fa-solid fa-dog fs-1 text-muted mb-3 opacity-50"></i>
                        <div class="alert alert-danger fs-5 shadow-sm border-0 rounded-3">Lo sentimos, no se pudo cargar la información de este producto.</div>
                        <a href="/catalogo/" class="btn btn-pet mt-3 px-4 py-2 fw-bold"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Catálogo</a>
                    </div>
                `;
            }
        }

        async function agregarAlCarrito(prodId, stockDisponible) {
            if (stockDisponible <= 0) return;

            const token = localStorage.getItem('token');
            if (!token) {
                alert("Debes iniciar sesión para agregar productos al carrito.");
                window.location.href = '/login/'; 
                return;
            }

            try {
                const response = await fetch('/api/carrito/items/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify({
                        producto_id: prodId,
                        cantidad_compra: 1
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("¡Producto agregado a tu carrito exitosamente!");
                } else {
                    alert(`Error: ${data.error || 'No se pudo agregar al carrito.'}`);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Ocurrió un error inesperado al conectar con el servidor.");
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            window.location.href = '/login/';
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
