{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Compras - Huellitas & Cía.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos de Mascotas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS TEMÁTICOS TIENDA DE MASCOTAS --- */
        body {
            /* Imagen de fondo desde static */
            background-image: url('{% static "img/fondo_mascotas.jpg" %}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #fdf8f5; 
        }
        .navbar-pet { background-color: #ff7b54; } 
        .card-pet { 
            border-radius: 1.5rem; 
            border: none; 
            border-top: 6px solid #ff7b54;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            background-color: rgba(255, 255, 255, 0.95);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-pet:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .btn-pet { 
            background-color: #ff7b54; 
            color: white; 
            border: none; 
            border-radius: 0.5rem; 
            transition: 0.3s; 
        }
        .btn-pet:hover { 
            background-color: #f06a43; 
            color: white; 
            transform: translateY(-2px); 
        }
        .text-pet { color: #ff7b54; }
    </style>
</head>
<body>

    <!-- Navegación Cliente Temática -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pet mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">
                <i class="fa-solid fa-paw me-2"></i>Huellitas & Cía.
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="/catalogo/"><i class="fa-solid fa-store me-1"></i> Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="/carrito/"><i class="fa-solid fa-cart-shopping me-1"></i> Mi Carrito</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/compras/"><i class="fa-solid fa-bag-shopping me-1"></i> Mis Compras</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-light btn-sm px-3 fw-bold text-pet rounded-pill" onclick="cerrarSesion()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        
        <!-- Cabecera -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-5 bg-white bg-opacity-90 p-4 rounded-4 shadow-sm">
            <h2 class="fw-bold text-dark mb-3 mb-md-0">
                <i class="fa-solid fa-clock-rotate-left text-pet me-3"></i>Historial de Mis Compras
            </h2>
            <a href="/catalogo/" class="btn btn-outline-secondary fw-bold rounded-pill px-4">
                <i class="fa-solid fa-store me-2"></i>Seguir Comprando
            </a>
        </div>

        <div class="row g-4" id="contenedor-compras">
            <!-- Loader inicial -->
            <div class="col-12 text-center py-5">
                <div class="bg-white bg-opacity-75 rounded-4 p-5 d-inline-block shadow-sm">
                    <div class="spinner-border text-pet" style="width: 3rem; height: 3rem;" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <h5 class="text-muted mt-3 mb-0">Buscando tus recibos...</h5>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de conexión con la API -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            cargarMisCompras();
        });

        function cargarMisCompras() {
            const token = localStorage.getItem('token');
            
            if (!token) {
                window.location.href = '/login/';
                return;
            }

            fetch('/api/mis_compras/', {
                method: 'GET',
                headers: {
                    'Authorization': `Token ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login/';
                    throw new Error('Sesión expirada');
                }
                return response.json();
            })
            .then(data => {
                const contenedor = document.getElementById('contenedor-compras');
                contenedor.innerHTML = ''; 

                if (data.length === 0) {
                    contenedor.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <div class="bg-white bg-opacity-90 rounded-4 p-5 shadow-sm d-inline-block border border-light">
                                <i class="fa-solid fa-basket-shopping text-muted opacity-25" style="font-size: 4rem;"></i>
                                <h4 class="mt-3 text-dark">Aún no tienes compras</h4>
                                <p class="text-muted mb-0">¡Anímate a consentir a tus mascotas en nuestro catálogo!</p>
                                <a href="/catalogo/" class="btn btn-pet mt-4 px-4 fw-bold shadow-sm">Explorar Tienda</a>
                            </div>
                        </div>`;
                    return;
                }

                data.forEach(compra => {
                    // Formatear precio y fecha
                    const totalFormateado = Number(compra.total).toLocaleString('es-CL');
                    const fechaFormateada = new Date(compra.fecha).toLocaleDateString('es-CL', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });

                    const card = `
                        <div class="col-md-6 col-lg-4">
                            <div class="card card-pet h-100 d-flex flex-column">
                                <div class="card-body p-4 d-flex flex-column">
                                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                                        <h5 class="card-title fw-bold text-dark mb-0">
                                            <i class="fa-solid fa-hashtag text-muted me-1"></i>${compra.id_venta}
                                        </h5>
                                        <span class="badge bg-success rounded-pill px-3 py-2 shadow-sm">
                                            <i class="fa-solid fa-check-circle me-1"></i>${compra.metodo_pago || 'Completada'}
                                        </span>
                                    </div>
                                    
                                    <p class="card-text text-secondary mb-2">
                                        <i class="fa-regular fa-calendar-check me-2 opacity-75"></i>${fechaFormateada}
                                    </p>
                                    
                                    <div class="mt-auto pt-3">
                                        <h3 class="card-text fw-bold text-pet mb-3">$${totalFormateado}</h3>
                                        <a href="/compra/${compra.id_venta}/" class="btn btn-pet w-100 fw-bold shadow-sm py-2">
                                            <i class="fa-solid fa-eye me-2"></i> Ver Detalles
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });
            })
            .catch(error => {
                console.error('Error al cargar las compras:', error);
                document.getElementById('contenedor-compras').innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="alert alert-danger shadow-sm rounded-4 fs-5 p-4 border-0">
                            <i class="fa-solid fa-triangle-exclamation me-2"></i> Hubo un error al cargar tu historial.
                        </div>
                    </div>`;
            });
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            window.location.href = '/login/';
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
