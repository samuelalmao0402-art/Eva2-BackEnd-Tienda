{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Huellitas & Cía.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos de Mascotas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS TEMÁTICOS TIENDA DE MASCOTAS --- */
        body {
            /* Imagen de fondo desde static */
            background-image: url('{% static "img/fondo_mascotas.jpg" %}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #fdf8f5; 
        }
        .card-pet { 
            border-radius: 1.5rem; 
            border: none; 
            border-top: 8px solid #ff7b54;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            background-color: rgba(255, 255, 255, 0.95);
        }
        .btn-pet { 
            background-color: #ff7b54; 
            color: white; 
            border: none; 
            border-radius: 0.5rem; 
            transition: 0.3s; 
        }
        .btn-pet:hover { 
            background-color: #f06a43; 
            color: white; 
            transform: translateY(-2px); 
        }
        .bg-pet { background-color: #ff7b54; }
        .text-pet { color: #ff7b54; }
        .form-control:focus {
            border-color: #ff7b54;
            box-shadow: 0 0 0 0.25rem rgba(255, 123, 84, 0.25);
        }
    </style>
</head>
<body class="d-flex align-items-center" style="min-height: 100vh; padding: 2rem 0;">

    <div class="container">
        
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-pet">
                    
                    <div class="card-header bg-transparent text-center py-4 border-0">
                        <div class="d-inline-flex justify-content-center align-items-center bg-pet text-white rounded-circle mb-3 shadow-sm" style="width: 80px; height: 80px; font-size: 2.5rem;">
                            <i class="fa-solid fa-paw"></i>
                        </div>
                        <h3 class="mb-0 fw-bold text-dark">Huellitas & Cía.</h3>
                        <p class="mb-0 text-muted">Ingresa a tu cuenta</p>
                    </div>
                    
                    <div class="card-body p-4 p-md-5 pt-0">
                        
                        <!-- Formulario de Login -->
                        <form id="login-form" onsubmit="iniciarSesion(event)">
                            <div class="mb-4">
                                <label for="email" class="form-label fw-bold text-secondary"><i class="fa-solid fa-envelope me-2 text-pet"></i>Correo Electrónico</label>
                                <input type="email" id="email" class="form-control form-control-lg shadow-sm" required placeholder="ejemplo@correo.com">
                            </div>
                            
                            <div class="mb-5">
                                <label for="password" class="form-label fw-bold text-secondary"><i class="fa-solid fa-lock me-2 text-pet"></i>Contraseña</label>
                                <input type="password" id="password" class="form-control form-control-lg shadow-sm" required placeholder="********">
                            </div>
                            
                            <button type="submit" id="btn-login" class="btn btn-pet btn-lg w-100 fw-bold shadow-sm py-3">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Entrar
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted mb-0 fs-5">¿No tienes cuenta? <br>
                                <a href="{% url 'ingresar_cli' %}" class="text-decoration-none fw-bold text-pet mt-2 d-inline-block">Regístrate aquí</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de conexión con tu LoginAPIView -->
    <script>
        async function iniciarSesion(event) {
            event.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            // Bloqueamos el botón mientras carga
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Verificando...';

            try {
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 1. Guardamos el token y el rol de forma segura
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('rol', data.roles);

                    // 2. Redirección inteligente según el rol
                    if (data.es_admin || data.roles === 'admin') {
                        window.location.href = '/inicio/'; // Al dashboard de administrador
                    } else {
                        window.location.href = '/catalogo/'; // A la tienda del cliente
                    }
                } else {
                    alert(`Error: ${data.error}`);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Entrar';
                }
            } catch (error) {
                console.error("Error al iniciar sesión:", error);
                alert("Error de conexión con el servidor. Revisa tu backend.");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Entrar';
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
