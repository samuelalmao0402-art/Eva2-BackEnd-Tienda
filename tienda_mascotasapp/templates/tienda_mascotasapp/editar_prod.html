{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Huellitas & Cía.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos de Mascotas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS TEMÁTICOS TIENDA DE MASCOTAS --- */
        body {
            /* Imagen de fondo desde static */
            background-image: url('{% static "img/fondo_mascotas.jpg" %}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #fdf8f5; 
        }
        .navbar-pet { background-color: #ff7b54; } 
        .card-pet { 
            border-radius: 1.5rem; 
            border: none; 
            border-top: 8px solid #ff7b54;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            background-color: rgba(255, 255, 255, 0.95);
        }
        .btn-pet { 
            background-color: #ff7b54; 
            color: white; 
            border: none; 
            border-radius: 0.5rem; 
            transition: 0.3s; 
        }
        .btn-pet:hover { 
            background-color: #f06a43; 
            color: white; 
            transform: translateY(-2px); 
        }
        .text-pet { color: #ff7b54; }
        .form-control:focus, .form-select:focus {
            border-color: #ff7b54;
            box-shadow: 0 0 0 0.25rem rgba(255, 123, 84, 0.25);
        }
    </style>
</head>
<body>

    <!-- Navegación Admin Temática -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pet mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/inicio/">
                <i class="fa-solid fa-paw me-2"></i>Huellitas & Cía. - Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center fw-semibold">
                    <li class="nav-item"><a class="nav-link active" href="/ver_productos/"><i class="fa-solid fa-box me-1"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_clientes/"><i class="fa-solid fa-users me-1"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_stock/"><i class="fa-solid fa-cubes me-1"></i> Stock</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_ventas/"><i class="fa-solid fa-receipt me-1"></i> Ventas</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-light btn-sm px-3 fw-bold text-pet rounded-pill" onclick="cerrarSesion()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card card-pet">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-4 border-0">
                        <h4 class="mb-0 fw-bold text-dark">
                            <i class="fa-solid fa-pen-to-square text-pet me-2"></i>Editar Producto #<span id="prod-id" class="text-pet">...</span>
                        </h4>
                        <a href="/ver_productos/" class="btn btn-outline-secondary btn-sm rounded-pill fw-bold px-3 shadow-sm">
                            <i class="fa-solid fa-xmark me-1"></i> Cancelar
                        </a>
                    </div>
                    
                    <div class="card-body p-4 p-md-5 pt-0">
                        
                        <form id="form-editar-producto" onsubmit="actualizarProducto(event)">
                            <div class="row mb-4 bg-light p-4 rounded-4 shadow-sm border border-white">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-tag me-1"></i> Nombre del Producto</label>
                                    <input type="text" id="nombre_producto" class="form-control form-control-lg border-0 shadow-sm" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-copyright me-1"></i> Marca</label>
                                    <input type="text" id="marca" class="form-control form-control-lg border-0 shadow-sm" required>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-layer-group me-1"></i> Categoría</label>
                                    <select id="categoria" class="form-select form-select-lg shadow-sm" required>
                                        <option value="Perro">🐶 Perro</option>
                                        <option value="Gato">🐱 Gato</option>
                                        <option value="Aves">🦜 Aves</option>
                                        <option value="Accesorios">🎾 Accesorios</option>
                                        <option value="Farmacia">💊 Farmacia</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary"><i class="fa-regular fa-calendar-xmark me-1"></i> Vencimiento <small class="text-muted fw-normal">(Opcional)</small></label>
                                    <input type="date" id="fecha_venc" class="form-control form-control-lg shadow-sm">
                                </div>
                            </div>

                            <div class="row mb-5 align-items-end">
                                <div class="col-md-4 mb-3 mb-md-0">
                                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-money-bill-wave me-1"></i> Precio Costo ($)</label>
                                    <input type="number" id="precio_costo" class="form-control form-control-lg shadow-sm font-monospace text-end" required min="0">
                                </div>
                                <div class="col-md-4 mb-3 mb-md-0">
                                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-hand-holding-dollar me-1 text-success"></i> Precio Venta ($)</label>
                                    <input type="number" id="precio_venta" class="form-control form-control-lg shadow-sm font-monospace text-end text-success fw-bold" required min="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-power-off me-1"></i> Estado</label>
                                    <select id="estado" class="form-select form-select-lg shadow-sm fw-bold" required>
                                        <option value="true" class="text-success">🟢 Activo</option>
                                        <option value="false" class="text-danger">🔴 Inactivo</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" id="btn-actualizar" class="btn btn-pet w-100 fs-5 fw-bold py-3 shadow-sm">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Guardar Cambios
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');
        
        const pathArray = window.location.pathname.split('/').filter(Boolean);
        const productoId = pathArray[pathArray.length - 1]; 

        document.addEventListener("DOMContentLoaded", () => {
            if (!token || rol !== 'admin') {
                alert("Acceso denegado.");
                window.location.href = '/login/';
                return;
            }
            
            document.getElementById('prod-id').innerText = productoId;
            cargarDatosProducto();
        });

        async function cargarDatosProducto() {
            try {
                const response = await fetch(`/api/producto/${productoId}/`, {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${token}` }
                });

                if (!response.ok) throw new Error("No se pudo cargar el producto.");

                const prod = await response.json();

                document.getElementById('nombre_producto').value = prod.nombre_producto;
                document.getElementById('marca').value = prod.marca;
                document.getElementById('categoria').value = prod.categoria;
                document.getElementById('precio_costo').value = prod.precio_costo;
                document.getElementById('precio_venta').value = prod.precio_venta;
                document.getElementById('estado').value = prod.estado ? "true" : "false";
                
                if (prod.fecha_venc) {
                    document.getElementById('fecha_venc').value = prod.fecha_venc;
                }

            } catch (error) {
                console.error(error);
                alert("Error al cargar los datos del producto.");
                window.location.href = '/ver_productos/';
            }
        }

        async function actualizarProducto(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btn-actualizar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Actualizando...';

            const payload = {
                nombre_producto: document.getElementById('nombre_producto').value,
                marca: document.getElementById('marca').value,
                categoria: document.getElementById('categoria').value,
                precio_costo: document.getElementById('precio_costo').value,
                precio_venta: document.getElementById('precio_venta').value,
                fecha_venc: document.getElementById('fecha_venc').value || null,
                estado: document.getElementById('estado').value === 'true'
            };

            try {
                const response = await fetch(`/api/producto/${productoId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Producto actualizado exitosamente.");
                    window.location.href = '/ver_productos/';
                } else {
                    const data = await response.json();
                    alert(`Error: ${data.error || 'Revisa los datos ingresados.'}`);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i> Guardar Cambios';
                }
            } catch (error) {
                console.error("Error al actualizar:", error);
                alert("Ocurrió un error al conectar con el servidor.");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i> Guardar Cambios';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            window.location.href = '/login/';
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
