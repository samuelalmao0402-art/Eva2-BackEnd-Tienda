{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes - Huellitas & Cía.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos de Mascotas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS TEMÁTICOS TIENDA DE MASCOTAS --- */
        body {
            /* Imagen de fondo desde static */
            background-image: url('{% static "img/fondo_mascotas.jpg" %}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #fdf8f5; 
        }
        .navbar-pet { background-color: #ff7b54; } 
        .card-pet { 
            border-radius: 1.5rem; 
            border: none; 
            border-top: 8px solid #0dcaf0; /* Borde celeste para Clientes */
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            background-color: rgba(255, 255, 255, 0.95);
        }
        .btn-pet { 
            background-color: #ff7b54; 
            color: white; 
            border: none; 
            border-radius: 0.5rem; 
            transition: 0.3s; 
        }
        .btn-pet:hover { 
            background-color: #f06a43; 
            color: white; 
            transform: translateY(-2px); 
        }
        .text-pet { color: #ff7b54; }
    </style>
</head>
<body>

    <!-- Navegación Admin Temática -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pet mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/inicio/">
                <i class="fa-solid fa-paw me-2"></i>Huellitas & Cía. - Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="/ver_productos/"><i class="fa-solid fa-box me-1"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/ver_clientes/"><i class="fa-solid fa-users me-1"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_stock/"><i class="fa-solid fa-cubes me-1"></i> Stock</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_ventas/"><i class="fa-solid fa-receipt me-1"></i> Ventas</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-light btn-sm px-3 fw-bold text-pet rounded-pill" onclick="cerrarSesion()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        
        <!-- Cabecera -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 bg-white bg-opacity-90 p-4 rounded-4 shadow-sm">
            <h2 class="fw-bold text-dark mb-3 mb-md-0">
                <i class="fa-solid fa-users-gear text-info me-3"></i>Registro de Clientes
            </h2>
            <a href="/inicio/" class="btn btn-outline-secondary fw-bold rounded-pill px-4">
                <i class="fa-solid fa-house me-2"></i>Volver al Inicio
            </a>
        </div>

        <div class="card card-pet overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 text-muted">#</th>
                                <th class="py-3"><i class="fa-solid fa-id-card me-1 text-muted"></i> RUT</th>
                                <th class="text-start py-3"><i class="fa-solid fa-user me-1 text-muted"></i> Nombre Completo</th>
                                <th class="py-3"><i class="fa-solid fa-envelope me-1 text-muted"></i> Correo Electrónico</th>
                                <th class="py-3"><i class="fa-solid fa-phone me-1 text-muted"></i> Teléfono</th>
                                <th class="py-3 pe-4"><i class="fa-solid fa-map-location-dot me-1 text-muted"></i> Dirección</th>
                            </tr>
                        </thead>
                        <tbody id="lista-clientes">
                            <tr>
                                <td colspan="6" class="py-5">
                                    <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;"></div>
                                    <p class="mt-3 mb-0 text-muted">Cargando base de datos de clientes...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de conexión con la API -->
    <script>
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');

        document.addEventListener("DOMContentLoaded", () => {
            if (!token || rol !== 'admin') {
                alert("Acceso denegado. Área exclusiva para administradores.");
                window.location.href = '/login/';
                return;
            }
            cargarClientes();
        });

        async function cargarClientes() {
            try {
                const response = await fetch('/api/cliente/', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const clientes = await response.json();
                    const tbody = document.getElementById('lista-clientes');
                    tbody.innerHTML = '';

                    if (clientes.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="text-muted py-5"><i class="fa-solid fa-users-slash fs-1 mb-3 opacity-25"></i><br>No hay clientes registrados en el sistema.</td></tr>';
                        return;
                    }

                    clientes.forEach((c, index) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="fw-bold text-muted bg-light border-end">${index + 1}</td>
                            <td class="fw-semibold text-secondary">${c.rut}</td>
                            <td class="text-start fw-bold text-dark py-3 ps-3">${c.nombre}</td>
                            <td class="text-primary"><a href="mailto:${c.email}" class="text-decoration-none">${c.email}</a></td>
                            <td class="text-secondary">${c.telefono}</td>
                            <td class="pe-4 text-muted small">${c.direccion}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    document.getElementById('lista-clientes').innerHTML = '<tr><td colspan="6" class="text-danger py-5"><i class="fa-solid fa-triangle-exclamation me-2"></i>Error al obtener los datos de la API.</td></tr>';
                }
            } catch (error) {
                console.error("Error al cargar clientes:", error);
                document.getElementById('lista-clientes').innerHTML = '<tr><td colspan="6" class="text-danger py-5"><i class="fa-solid fa-triangle-exclamation me-2"></i>Error de conexión con el servidor.</td></tr>';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            window.location.href = '/login/';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
