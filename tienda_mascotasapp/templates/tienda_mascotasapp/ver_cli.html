<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil del Cliente</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f4; 
            margin: 0; 
            padding: 0; 
        }
        .contenedor { 
            width: 50%; 
            margin: 50px auto; 
            background-color: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { 
            text-align: center; 
            color: #333;
            border-bottom: 2px solid #008CBA;
            padding-bottom: 10px;
        }
        .info { 
            margin-top: 20px; 
            font-size: 1.1em; 
            line-height: 1.8; 
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .info strong { 
            color: #555; 
            display: inline-block;
            width: 150px;
        }
        .acciones { 
            text-align: center; 
            margin-top: 30px; 
        }
        .boton { 
            display: inline-block; 
            padding: 10px 20px; 
            background-color: #333; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold;
        }
        .boton:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>👤 Perfil de Cliente</h1>

    <div class="info">
        <!-- Llamamos a la variable 'cliente' y a sus atributos exactos de models.py -->
        <p><strong>Nombre:</strong> {{ cliente.nombre }}</p>
        <p><strong>RUT:</strong> {{ cliente.rut }}</p>
        <p><strong>Teléfono:</strong> {{ cliente.telefono }}</p>
        <p><strong>Correo:</strong> {{ cliente.correo }}</p>
        <p><strong>Dirección:</strong> {{ cliente.direccion }}</p>
    </div>

    <div class="acciones">
        <a href="{% url 'inicio' %}" class="boton">🏠 Volver al Inicio</a>
    </div>
</div>

</body>
</html>
