{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock - Huellitas & Cía.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos de Mascotas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS TEMÁTICOS TIENDA DE MASCOTAS --- */
        body {
            background-image: url('{% static "img/fondo_mascotas.jpg" %}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #fdf8f5; 
        }
        .navbar-pet { background-color: #ff7b54; } 
        .card-pet { 
            border-radius: 1.5rem; 
            border: none; 
            border-top: 8px solid #ffc107; /* Borde amarillo para Stock */
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            background-color: rgba(255, 255, 255, 0.95);
        }
        .btn-pet { 
            background-color: #ff7b54; 
            color: white; 
            border: none; 
            border-radius: 0.5rem; 
            transition: 0.3s; 
        }
        .btn-pet:hover { 
            background-color: #f06a43; 
            color: white; 
            transform: translateY(-2px); 
        }
        .text-pet { color: #ff7b54; }
    </style>
</head>
<body>

    <!-- Navegación Admin Temática -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pet mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/inicio/">
                <i class="fa-solid fa-paw me-2"></i>Huellitas & Cía. - Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="/ver_productos/"><i class="fa-solid fa-box me-1"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_clientes/"><i class="fa-solid fa-users me-1"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/ver_stock/"><i class="fa-solid fa-cubes me-1"></i> Stock</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ver_ventas/"><i class="fa-solid fa-receipt me-1"></i> Ventas</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-light btn-sm px-3 fw-bold text-pet rounded-pill" onclick="cerrarSesion()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        
        <!-- Cabecera -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 bg-white bg-opacity-90 p-4 rounded-4 shadow-sm">
            <h2 class="fw-bold text-dark mb-3 mb-md-0">
                <i class="fa-solid fa-boxes-stacked text-warning me-3"></i>Control de Inventario
            </h2>
            <a href="/inicio/" class="btn btn-outline-secondary fw-bold rounded-pill px-4">
                <i class="fa-solid fa-house me-2"></i>Volver al Inicio
            </a>
        </div>
        
        <!-- Tabla de Stock -->
        <div class="card card-pet overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 text-muted">ID</th>
                                <th class="text-start py-3">Producto</th>
                                <th class="py-3">Stock Mínimo</th>
                                <th class="py-3">Stock Actual</th>
                                <th class="py-3">Estado de Alerta</th>
                                <th class="py-3 pe-4">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-stock-body">
                            <tr>
                                <td colspan="6" class="py-5">
                                    <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;">
                                        <span class="visually-hidden">Cargando inventario...</span>
                                    </div>
                                    <p class="text-muted mt-3 mb-0">Revisando las bodegas...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de conexión con la API -->
    <script>
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');

        document.addEventListener("DOMContentLoaded", () => {
            if (!token || rol !== 'admin') {
                alert("Acceso denegado. Área exclusiva para administradores.");
                window.location.href = '/login/';
                return;
            }
            cargarInventario();
        });

        async function cargarInventario() {
            const tbody = document.getElementById('tabla-stock-body');

            try {
                const response = await fetch('/api/stock/', {
                    method: 'GET',
                    headers: { 'Authorization': `Token ${token}` }
                });

                if (!response.ok) throw new Error("Error al cargar el inventario.");

                const productos = await response.json();
                tbody.innerHTML = '';

                if (productos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="py-5 text-muted"><i class="fa-solid fa-box-open fs-1 mb-3 opacity-25"></i><br>No hay productos registrados en el sistema.</td></tr>';
                    return;
                }

                productos.forEach(prod => {
                    let alertaHtml = '';
                    let stockClass = 'fw-bold fs-5 ';
                    
                    if (prod.stock <= 0) {
                        alertaHtml = '<span class="badge bg-danger rounded-pill px-3 py-2 shadow-sm"><i class="fa-solid fa-circle-xmark me-1"></i>Agotado</span>';
                        stockClass += 'text-danger';
                    } else if (prod.stock <= prod.stock_min) {
                        alertaHtml = '<span class="badge bg-warning text-dark rounded-pill px-3 py-2 shadow-sm"><i class="fa-solid fa-triangle-exclamation me-1"></i>Crítico</span>';
                        stockClass += 'text-warning';
                    } else {
                        alertaHtml = '<span class="badge bg-success rounded-pill px-3 py-2 shadow-sm"><i class="fa-solid fa-check-circle me-1"></i>Óptimo</span>';
                        stockClass += 'text-success';
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-bold text-muted bg-light border-end">#${prod.id}</td>
                        <td class="text-start fw-bold text-dark py-3 ps-3"><i class="fa-solid fa-tag text-pet opacity-50 me-2"></i>${prod.nombre_producto}</td>
                        <td class="text-muted">${prod.stock_min} un.</td>
                        <td class="${stockClass}">${prod.stock}</td>
                        <td>${alertaHtml}</td>
                        <td class="pe-4">
                            <a href="/actualizar_stock/${prod.id}/" class="btn btn-sm btn-pet fw-bold shadow-sm px-3">
                                <i class="fa-solid fa-boxes-packing me-1"></i> Reponer
                            </a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="6" class="text-danger py-5"><i class="fa-solid fa-triangle-exclamation me-2"></i>Error al conectar con la API.</td></tr>';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            window.location.href = '/login/';
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
